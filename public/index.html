<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d101b"><title>МыслиВслуХ — живые ответы</title><style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#0d101b;--panel:#171b29;--line:#2a2f42;--muted:#a1a8bf;--lime:#d5fa73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f4fb;font:15px Manrope,system-ui,sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:5px}button{cursor:pointer;border:0;border-radius:12px;padding:13px 20px;background:var(--lime);color:#17220b;font-weight:800}button:hover{filter:brightness(1.08)}button:disabled{opacity:.45;cursor:default}a{color:var(--lime)}.secondary{background:#252b3d;color:#e7eafa}.danger{background:#482c36;color:#ffb6c6}.small{padding:9px 12px;font-size:12px}.shell{max-width:1440px;margin:auto;padding:28px 40px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.brand{font-size:21px;font-weight:800;letter-spacing:-.8px}.brand i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--lime);color:#111;margin-right:10px;font-style:normal}.tag{color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:30px;padding:8px 13px;font-size:12px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--lime)}h1{font-size:clamp(32px,4vw,58px);letter-spacing:-2px;line-height:1.12;margin:16px 0 24px}h2{font-size:22px;letter-spacing:-.6px}p{color:var(--muted);line-height:1.7}.layout{display:grid;grid-template-columns:1fr 330px;gap:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}.form{display:grid;gap:18px}label{display:grid;gap:8px;color:#c8cde0;font-size:13px}input,select{width:100%;border:1px solid #373d52;border-radius:11px;padding:13px;background:#0f1320;color:white}input[type=checkbox]{width:18px;height:18px;accent-color:var(--lime)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.check{display:flex;align-items:center}.cloud-wrap{height:470px;position:relative;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#242237 0%,#141725 65%);margin-top:24px}.cloud-wrap:after{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#a5afcc18 1px,transparent 1px);background-size:28px 28px}canvas{position:relative;z-index:1;width:100%;height:100%;display:block}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;z-index:2;transition:opacity .18s ease,visibility .18s ease}.empty.hidden{opacity:0;visibility:hidden}.empty b{font-size:22px}.empty p{max-width:300px;margin:12px auto}.stats{display:flex;gap:26px;padding:18px 4px;color:var(--muted);font-size:12px}.stats strong{font-size:19px;color:white;margin-right:7px}.code{font-size:36px;letter-spacing:5px;font-weight:800;color:var(--lime);margin:12px 0}.join{text-align:center}.join p{font-size:13px}.word-list{max-height:230px;overflow:auto;margin-top:12px}.word-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.word-row span{overflow-wrap:anywhere}.hero{max-width:650px}.intro-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:60px;align-items:center}.intro-cloud{height:380px}.footer{margin-top:30px;font-size:12px;color:#787f99;display:flex;justify-content:space-between}.phone{max-width:460px;margin:40px auto}.phone h1{font-size:34px}.notice{border:1px solid #3b4259;border-radius:12px;padding:14px;color:#ccd2e7;line-height:1.5;margin:18px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#edf5dc;color:#17220b;padding:14px 22px;border-radius:12px;z-index:50;max-width:90vw;box-shadow:0 10px 50px #0008}.connection{color:#ffca80}.present .shell{max-width:none}.present .nav,.present aside,.present .footer{display:none}.present .layout{grid-template-columns:1fr}.present .cloud-wrap{height:68vh}.present h1{font-size:clamp(28px,4vw,60px)}.present .present-join{display:block!important}.present-join{display:none;margin-left:auto}.qr-code{display:block;width:180px;height:180px;margin:12px auto;border-radius:8px;overflow:hidden;background:white}.qr-code[hidden]{display:none}.qr-code svg{width:100%;height:100%;display:block}.present .present-join{display:flex!important;align-items:center;gap:16px}.present-join .qr-code{width:120px;height:120px;margin:0}.present-join strong{color:var(--lime);letter-spacing:4px}.close-present{position:fixed;right:20px;top:20px;z-index:20;opacity:.4}.close-present:hover{opacity:1}@media(max-width:850px){.shell{padding:20px}.layout,.intro-grid{grid-template-columns:1fr;gap:24px}.nav{margin-bottom:26px}.intro-grid{gap:10px}.intro-cloud{height:270px}.cloud-wrap{height:350px}h1{letter-spacing:-1px}.phone{margin:20px auto}.tag{font-size:10px}.two{grid-template-columns:1fr 1fr}.footer{gap:15px}.present .cloud-wrap{height:60vh}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main id="app"></main><div id="toast" class="toast" hidden role="status"></div><script>
// __QR_CODE__

const $=s=>document.querySelector(s),app=$('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);let code=params.get('room'),secret=location.hash.startsWith('#host=')?location.hash.slice(6):'',state=null,poll=null,cloud=null,participant=localStorage.getItem('slovopotok-id');if(!participant){participant=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('slovopotok-id',participant);}const statuses={ready:'Готов к запуску',open:'Принимаем ответы',paused:'Пауза',stopped:'Раунд завершён'};
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,4000)}async function api(path,data,host=false){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'content-type':'application/json',...(host?{authorization:'Bearer '+secret}:{})}:{},body:data?JSON.stringify(data):undefined});const b=await r.json();if(!r.ok)throw new Error(b.error);return b;}
function nav(){return '<nav class="nav"><div class="brand"><i>✳</i>МыслиВслуХ</div><span class="pill"><span class="dot"></span> Ответы становятся видимыми</span></nav>'}function footer(){return '<footer class="footer"><span>Много голосов. Одна картина.</span><span>МыслиВслуХ · живое облако ответов</span></footer>'}
function home(){app.innerHTML='<div class="shell">'+nav()+'<div class="intro-grid"><section class="hero"><div class="tag">ДЛЯ ВСТРЕЧ, УРОКОВ И БОЛЬШИХ ИДЕЙ</div><h1>Задайте вопрос.<br>Поймайте <span style="color:var(--lime)">поток мыслей.</span></h1><p>Участники отвечают с телефонов, а слова оживают на общем экране. Чем больше голосов — тем заметнее идея.</p><div class="cloud-wrap intro-cloud"><canvas id="cloud" aria-label="Демонстрация облака слов"></canvas></div></section><section class="card"><h2>Начнём с вашего вопроса</h2><p>Создайте комнату и пригласите участников.</p><form id="create" class="form"><label>Вопрос для участников<input name="question" maxlength="180" required placeholder="Что вдохновляет вас сегодня?"></label><div class="two"><label>Ответов на человека<select name="maxAnswers"><option>1</option><option>2</option><option selected>3</option><option>5</option><option>10</option></select></label><label>Время на ответы<select name="duration"><option value="0">Без ограничения</option><option value="30">30 секунд</option><option value="60">1 минута</option><option value="120">2 минуты</option><option value="300">5 минут</option></select></label></div><label class="check"><input name="filter" type="checkbox" checked>Фильтр нежелательных слов</label><button>Создать комнату ↗</button></form><div style="border-top:1px solid var(--line);margin-top:24px;padding-top:18px"><label>Вы участник? Введите код комнаты</label><form id="join" class="row" style="margin-top:10px"><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required style="flex:1;width:120px"><button class="secondary">Войти →</button></form></div></section></div>'+footer()+'</div>';cloud=new Cloud($('#cloud'));cloud.update([{word:'вдохновение',count:8},{word:'люди',count:5},{word:'свобода',count:4},{word:'новые идеи',count:3},{word:'музыка',count:2},{word:'любопытство',count:2},{word:'движение',count:1},{word:'кофе',count:1}]);$('#create').onsubmit=async e=>{e.preventDefault();const f=e.target,button=f.querySelector('button');button.disabled=true;try{const b=await api('rooms',{question:f.question.value,maxAnswers:+f.maxAnswers.value,duration:+f.duration.value,filter:f.filter.checked});location.href='/?room='+b.code+'#host='+b.secret;}catch(e){toast(e.message);button.disabled=false}};$('#join').onsubmit=e=>{e.preventDefault();location.href='/?room='+e.target.code.value};}
function roomUI(){const host=!!secret,present=params.has('screen');document.body.classList.toggle('present',present);app.innerHTML='<div class="shell">'+nav()+(host||present?'<div class="layout"><section><div class="row"><span id="status" class="pill"></span><span id="timer" class="pill"></span><span id="connection" class="tag"></span><span class="present-join"><span class="qr-code" id="screen-qr"></span><span>Присоединяйтесь: <strong>'+esc(code)+'</strong></span></span></div><h1 id="question"></h1><div class="cloud-wrap"><canvas id="cloud" aria-label="Живое облако ответов"></canvas><div id="empty" class="empty"><b>Здесь появятся ваши идеи</b><p>Запустите раунд и отправьте первый ответ с телефона.</p></div></div><div class="stats"><span><strong id="people">0</strong>участников</span><span><strong id="answers">0</strong>ответов</span><span><strong id="words">0</strong>слов</span></div></section><aside><section class="card join"><div class="tag">КОМНАТА ДЛЯ УЧАСТНИКОВ</div><div class="code">'+esc(code)+'</div><div class="qr-code" id="host-qr"></div><p>Наведите камеру телефона на QR-код<br>или введите код комнаты.</p><button id="copy" class="secondary small">Скопировать ссылку</button><p id="join-url" style="overflow-wrap:anywhere"></p></section><section class="card" style="margin-top:18px"><h2>Управление эфиром</h2><div class="row"><button id="start">Начать →</button><button id="pause" class="secondary">Пауза</button><button id="stop" class="danger">Стоп</button></div><button id="screen" class="secondary" style="width:100%;margin-top:12px">⛶ На большой экран</button><button id="reset" class="secondary" style="width:100%;margin-top:12px">Новый вопрос</button><p id="settings" style="font-size:12px"></p><h2 style="font-size:15px">Модерация слов</h2><p style="font-size:12px">Скрытое слово больше не принимается в этом раунде.</p><div id="word-list" class="word-list"></div></section></aside></div>':'<section class="phone"><span class="pill">Комната '+esc(code)+'</span><h1 id="question">Подключаемся…</h1><span id="status" class="pill"></span> <span id="timer" class="pill"></span><div class="notice">Ваш ответ появится на общем экране. Напишите от 1 до 3 слов.</div><form id="answer-form" class="form"><label>Ваша идея<input id="answer-input" maxlength="80" autocomplete="off" placeholder="Например, новые возможности" required></label><button id="send">Отправить ответ ↗</button></form><p id="remaining"></p><div id="connection" class="tag"></div><div id="sent" class="notice" hidden role="status">✓ Ответ в облаке. Спасибо за вашу идею!</div><a href="/">В другую комнату</a></section>')+footer()+'</div>';if(host||present){cloud=new Cloud($('#cloud'));const link=location.origin+'/?room='+code;$('#join-url').textContent=link;try{const svg=qrSvg(link);$('#host-qr').innerHTML=svg;$('#screen-qr').innerHTML=svg;}catch(e){$('#host-qr').hidden=true;$('#screen-qr').hidden=true;toast(e.message);}$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Ссылка скопирована')}catch{toast(link)}};$('#screen').onclick=()=>{window.open('/?room='+code+'&screen=1','_blank','noopener')};if(host){for(const action of ['start','pause','stop'])$('#'+action).onclick=()=>control(action);$('#reset').onclick=()=>{const question=prompt('Вопрос для нового раунда',state.question);if(question?.trim())control('reset',{question})};}else{$('aside').hidden=true}}else{$('#answer-form').onsubmit=async e=>{e.preventDefault();$('#send').disabled=true;try{render(await api('rooms/'+code+'/answer',{participant,word:$('#answer-input').value}));$('#answer-input').value='';$('#sent').hidden=false;toast('Ответ отправлен')}catch(e){toast(e.message)}finally{updateSend()}};}refresh();if(typeof EventSource!=='undefined'){const events=new EventSource('/api/rooms/'+code+'/events?participant='+participant);events.onopen=()=>streaming=true;events.onmessage=e=>{try{render(JSON.parse(e.data));$('#connection').textContent='';}catch{}};events.onerror=()=>{streaming=false;events.close();};}poll=setInterval(refresh,180);setInterval(tick,250);}
async function control(action,data={}){try{render(await api('rooms/'+code+'/control',{action,...data},true));}catch(e){toast(e.message)}}let streaming=false,lastPoll=0;let refreshing=false;async function refresh(){if(refreshing||(streaming&&Date.now()-lastPoll<1200))return;lastPoll=Date.now();refreshing=true;try{render(await api('rooms/'+code+'?participant='+participant));$('#connection').textContent='';}catch(e){$('#connection').textContent=e.message;$('#connection').classList.add('connection');if($('#send'))$('#send').disabled=true;}finally{refreshing=false}}
function render(s){if(state&&s.now<state.now)return;const changed=state?.round!==s.round;state=s;state.receivedAt=performance.now();$('#question').textContent=s.question;$('#status').textContent=statuses[s.status];tick();if(cloud){cloud.setActive(s.status==='open');cloud.update(s.words);$('#empty').classList.toggle('hidden',s.words.length>0);$('#people').textContent=s.people;$('#answers').textContent=s.answers;$('#words').textContent=s.words.length;if(secret){$('#start').disabled=!['ready','paused'].includes(s.status);$('#start').textContent=s.status==='paused'?'Продолжить →':'Начать →';$('#pause').disabled=s.status!=='open';$('#stop').disabled=['stopped','ready'].includes(s.status);$('#settings').textContent=s.maxAnswers+' отв. на человека · '+(s.filter?'Фильтр включён':'Фильтр выключен');const signature=JSON.stringify(s.words);if($('#word-list').dataset.signature!==signature){$('#word-list').dataset.signature=signature;$('#word-list').innerHTML=s.words.map(w=>'<div class="word-row"><span>'+esc(w.word)+' <b style="color:var(--lime)">'+w.count+'</b></span><button class="secondary small" data-word="'+esc(w.word)+'" aria-label="Скрыть '+esc(w.word)+'">Скрыть</button></div>').join('');$('#word-list').querySelectorAll('button').forEach(b=>b.onclick=()=>control('hide',{word:b.dataset.word}));}}}else{$('#remaining').textContent='Осталось ответов: '+Math.max(0,s.maxAnswers-s.used)+' из '+s.maxAnswers;if(changed)$('#sent').hidden=true;updateSend();}}
function tick(){if(!state)return;const ms=state.status==='open'&&state.deadline?state.deadline-(state.now+performance.now()-state.receivedAt):state.remaining;$('#timer').textContent=state.duration?Math.max(0,Math.ceil(ms/1000))+' сек.':'Без таймера'}function updateSend(){if($('#send')&&state){$('#send').disabled=state.status!=='open'||state.used>=state.maxAnswers;$('#send').textContent=state.status==='open'?(state.used>=state.maxAnswers?'Все ответы отправлены':'Отправить ответ ↗'):statuses[state.status]}}
// __CLOUD_CODE__
if(code&&/^\d{6}$/.test(code))roomUI();else home();
</script></body></html>
