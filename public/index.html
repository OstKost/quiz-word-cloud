function switchTab(name){currentTab=name;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.tab-view').forEach(v=>v.classList.toggle('active',v.id==='tab-'+name));if(name==='cloud'&&cloud)cloud.resize();}
function openAiModal(){const c=getAiConfig();$('#ai-key').value=c.key||'';$('#ai-endpoint').value=c.endpoint||defaultAiConfig.endpoint;$('#ai-model').value=c.model||defaultAiConfig.model;$('#ai-modal').hidden=false;}
async function openHistoryModal(){$('#hist-modal').hidden=false;$('#hist-list').innerHTML='<p>Загрузка истории...</p>';try{const data=await api('rooms/'+code+'/history');const local=getHistoryStore();let map=new Map();local.forEach(x=>map.set(x.round,x));data.analyses.forEach(a=>{const r=a.round,existing=map.get(r)||{round:r};try{existing.analysis=JSON.parse(a.data);}catch{}map.set(r,existing);});const wordsByRound={};data.history.forEach(h=>{if(!wordsByRound[h.round])wordsByRound[h.round]=[];wordsByRound[h.round].push(h);});if(!map.size&&!data.history.length){$('#hist-list').innerHTML='<p>История пока пуста. Завершите первый раунд и запустите новый вопрос.</p>';return;}$('#hist-list').innerHTML=Array.from(map.values()).sort((a,b)=>b.round-a.round).map(item=>{const words=wordsByRound[item.round]||item.words||[];const summary=item.analysis?.summary||'Анализ не проводился';return '<div class="history-item"><div class="row" style="justify-content:space-between"><strong>Раунд '+item.round+': '+esc(item.question||state.question)+'</strong><span class="pill" style="font-size:11px">'+words.length+' ответов</span></div><p style="margin:8px 0;font-size:13px;color:#d8def4">'+esc(summary)+'</p><div style="font-size:12px;color:var(--muted)">'+words.slice(0,8).map(w=>esc(w.word)+' ('+w.count+')').join(', ')+(words.length>8?'...':'')+'</div></div>';}).join('');}catch(e){$('#hist-list').innerHTML='<p style="color:#ffb6c6">Ошибка загрузки: '+esc(e.message)+'</p>';}}
async function triggerAiAnalysis(manual=false){if(analyzing)return;if(!state||!state.words||!state.words.length){if(manual)toast('Нет ответов для анализа');return;}const cfg=getAiConfig();if(!cfg.key){if(manual){toast('Укажите OpenAI API Key в настройках');openAiModal();}return;}analyzing=true;if(secret)$('#btn-analyze').textContent='⏳ Анализируем...';try{const promptText='Ты эксперт-аналитик опросов аудитории. Проанализируй ответы на вопрос: "'+state.question+'".\nОтветы участников с частотой (число проголосовавших человек):\n'+state.words.map(w=>w.word+': '+w.count).join('\n')+'\n\nВерни СТРОГО один валидный JSON-объект без разметки markdown:\n{\n  "summary": "Краткий вывод о картине ответов на 1-2 предложения",\n  "consensus": [{"topic": "Тема совпадения", "percentage": 45, "description": "В чем именно сошлись мнения"}],\n  "themes": [{"title": "Название темы", "share": 35, "keywords": ["слово1", "слово2"], "insight": "О чем думали участники"}],\n  "unique": [{"word": "редкий ответ", "whyInteresting": "Почему выделяется"}]\n}';const url=cfg.endpoint.replace(/\/+$/,'')+'/chat/completions';const res=await fetch(url,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+cfg.key},body:JSON.stringify({model:cfg.model||'gpt-4o-mini',messages:[{role:'system',content:'You are an expert qualitative data analyst. Respond strictly with valid JSON.'},{role:'user',content:promptText}],temperature:0.2,response_format:{type:'json_object'}})});if(!res.ok){const errText=await res.text();throw new Error('OpenAI error: '+res.status+' '+(errText.slice(0,100)));}const jsonRes=await res.json();let content=jsonRes.choices?.[0]?.message?.content||'{}';content=content.replace(/^[^{]*({[\s\S]*})[^}]*$/,'$1');const parsed=JSON.parse(content);renderAnalysis(parsed);lastAnalyzedRound=state.round;switchTab('summary');if(secret){await api('rooms/'+code+'/analysis',{round:state.round,analysis:parsed},true);saveHistoryItem({round:state.round,question:state.question,words:state.words,analysis:parsed});toast('Анализ ответов готов!');}}catch(e){console.error(e);if(manual)toast('Ошибка анализа: '+e.message);}finally{analyzing=false;if(secret&&$('#btn-analyze'))$('#btn-analyze').textContent='✨ Анализ ответов (AI)';}}
function renderAnalysis(an){if(!an)return;$('#tab-summary').innerHTML='<div class="analysis-card"><div class="tag" style="margin-bottom:8px">РЕЗЮМЕ ОПРОСА</div><h2 style="margin:0 0 12px;font-size:22px;color:var(--lime);line-height:1.4">'+esc(an.summary||'Анализ завершён.')+'</h2><p style="font-size:14px;color:#ccd2e7;margin:0">На основе ответов '+state.people+' участников ('+state.answers+' ответов).</p></div>';$('#tab-consensus').innerHTML='<div class="tag" style="margin-bottom:12px">ГЛАВНЫЕ СОВПАДЕНИЯ МНЕНИЙ</div>'+(an.consensus&&an.consensus.length?an.consensus.map(c=>'<div class="analysis-card"><div class="row" style="justify-content:space-between"><strong>'+esc(c.topic)+'</strong><b style="color:var(--lime);font-size:18px">'+(c.percentage||0)+'%</b></div><div class="bar-track"><div class="bar-fill" style="width:'+Math.min(100,c.percentage||0)+'%"></div></div><p style="margin:6px 0 0;font-size:13px;color:#d8def4">'+esc(c.description||'')+'</p></div>').join(''):'<p>Четко выраженного консенсуса не выявлено, мнения участников разделились поровну.</p>');$('#tab-themes').innerHTML='<div class="tag" style="margin-bottom:12px">ТЕМАТИЧЕСКИЕ КОРЗИНЫ</div>'+(an.themes&&an.themes.length?an.themes.map(t=>'<div class="analysis-card"><div class="row" style="justify-content:space-between"><strong style="font-size:16px">'+esc(t.title)+'</strong><b style="color:#b395f8;font-size:16px">'+(t.share||0)+'% ответов</b></div><div class="bar-track"><div class="bar-fill purple" style="width:'+Math.min(100,t.share||0)+'%"></div></div><p style="margin:8px 0;font-size:13px;color:#e7eafa">'+esc(t.insight||'')+'</p><div>'+(t.keywords||[]).map(k=>'<span class="chip">'+esc(k)+'</span>').join('')+'</div></div>').join(''):'<p>Темы не выделены.</p>');$('#tab-unique').innerHTML='<div class="tag" style="margin-bottom:12px">НЕОБЫЧНЫЕ И РЕДКИЕ ИДЕИ</div>'+(an.unique&&an.unique.length?an.unique.map(u=>'<div class="analysis-card"><div style="font-size:17px;font-weight:800;color:var(--lime);margin-bottom:6px">«'+esc(u.word)+'»</div><p style="margin:0;font-size:13px;color:#d8def4">'+esc(u.whyInteresting||'')+'</p></div>').join(''):'<p>Все ответы вошли в основные кластеры.</p>');}
async function control(action,data={}){try{render(await api('rooms/'+code+'/control',{action,...data},true));}catch(e){toast(e.message)}}let streaming=false,lastPoll=0;let refreshing=false;async function refresh(){if(refreshing||(streaming&&Date.now()-lastPoll<1200))return;lastPoll=Date.now();refreshing=true;try{render(await api('rooms/'+code+'?participant='+participant));$('#connection').textContent='';}catch(e){$('#connection').textContent=e.message;$('#connection').classList.add('connection');if($('#send'))$('#send').disabled=true;}finally{refreshing=false}}
function render(s){if(state&&s.now<state.now)return;const changed=state?.round!==s.round,stoppedNow=state?.status!=='stopped'&&s.status==='stopped';state=s;state.receivedAt=performance.now();$('#question').textContent=s.question;$('#status').textContent=statuses[s.status];tick();
if(cloud){cloud.setActive(s.status==='open');cloud.update(s.words);$('#empty').classList.toggle('hidden',s.words.length>0);$('#people').textContent=s.people;$('#answers').textContent=s.answers;$('#words').textContent=s.words.length;
if(s.analysis){renderAnalysis(s.analysis);if(stoppedNow&&currentTab==='cloud')switchTab('summary');}
if(stoppedNow&&!s.analysis&&secret&&s.words.length&&lastAnalyzedRound!==s.round){triggerAiAnalysis(false);}
if(secret){$('#start').disabled=!['ready','paused'].includes(s.status);$('#start').textContent=s.status==='paused'?'Продолжить →':'Начать →';$('#pause').disabled=s.status!=='open';$('#stop').disabled=['stopped','ready'].includes(s.status);$('#settings').textContent=s.maxAnswers+' отв. на человека · '+(s.filter?'Фильтр включён':'Фильтр выключен');const signature=JSON.stringify(s.words);if($('#word-list').dataset.signature!==signature){$('#word-list').dataset.signature=signature;$('#word-list').innerHTML=s.words.map(w=>'<div class="word-row"><span>'+esc(w.word)+' <b style="color:var(--lime)">'+w.count+'</b></span><button class="secondary small" data-word="'+esc(w.word)+'" aria-label="Скрыть '+esc(w.word)+'">Скрыть</button></div>').join('');$('#word-list').querySelectorAll('button').forEach(b=>b.onclick=()=>control('hide',{word:b.dataset.word}));}}}else{$('#remaining').textContent='Осталось ответов: '+Math.max(0,s.maxAnswers-s.used)+' из '+s.maxAnswers;if(changed)$('#sent').hidden=true;updateSend();}}
function tick(){if(!state)return;const ms=state.status==='open'&&state.deadline?state.deadline-(state.now+performance.now()-state.receivedAt):state.remaining;$('#timer').textContent=state.duration?Math.max(0,Math.ceil(ms/1000))+' сек.':'Без таймера';if(state.status==='open'&&state.deadline&&ms<=0&&!state.autoStopping){state.autoStopping=true;refresh();}}
function updateSend(){if($('#send')&&state){$('#send').disabled=state.status!=='open'||state.used>=state.maxAnswers;$('#send').textContent=state.status==='open'?(state.used>=state.maxAnswers?'Все ответы отправлены':'Отправить ответ ↗'):statuses[state.status]}}
// __CLOUD_CODE__
if(code&&/^\d{6}$/.test(code))roomUI();else home();
</script></body></html>
