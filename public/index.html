function buildAiPrompt(){if(!state||!state.words||!state.words.length)return '';return 'Ты эксперт-аналитик опросов аудитории. Проанализируй ответы на вопрос: "'+state.question+'".\nОтветы участников с частотой (число проголосовавших человек):\n'+state.words.map(w=>w.word+': '+w.count).join('\n')+'\n\nВерни СТРОГО один валидный JSON-объект без разметки markdown:\n{\n  "summary": "Краткий вывод о картине ответов на 1-2 предложения",\n  "consensus": [{"topic": "Тема совпадения", "percentage": 45, "description": "В чем именно сошлись мнения"}],\n  "themes": [{"title": "Название темы", "share": 35, "keywords": ["слово1", "слово2"], "insight": "О чем думали участники"}],\n  "unique": [{"word": "редкий ответ", "whyInteresting": "Почему выделяется"}]\n}';}

async function loadHistory(){$('#hist-list').innerHTML='<p>Загрузка истории...</p>';try{const data=await api('rooms/'+code+'/history');if(data.resetToken!==state.resetToken){$('#hist-list').innerHTML='<p>История изменилась. Нажмите «Обновить».</p>';return;}syncHistoryToken(data.resetToken);const local=getHistoryStore();let map=new Map();local.forEach(x=>map.set(x.round,x));(data.rounds||[]).forEach(x=>map.set(x.round,{...map.get(x.round),...x}));data.history.forEach(x=>{if(!map.has(x.round))map.set(x.round,{round:x.round,question:'Раунд '+x.round})});data.analyses.forEach(a=>{const r=a.round,existing=map.get(r)||{round:r};try{existing.analysis=JSON.parse(a.data);}catch{}map.set(r,existing);});const wordsByRound={};data.history.forEach(h=>{if(!wordsByRound[h.round])wordsByRound[h.round]=[];wordsByRound[h.round].push(h);});if(!map.size&&!data.history.length){$('#hist-list').innerHTML='<p>История пока пуста. Завершите первый раунд и запустите новый вопрос.</p>';return;}$('#hist-list').innerHTML=Array.from(map.values()).sort((a,b)=>b.round-a.round).map(item=>{const words=wordsByRound[item.round]||item.words||[];const summary=item.analysis?.summary||'Анализ не проводился';return '<div class="history-item"><div class="row" style="justify-content:space-between"><strong>Раунд '+item.round+': '+esc(item.question||('Раунд '+item.round))+'</strong><span class="pill" style="font-size:11px">'+words.length+' ответов</span></div><p style="margin:8px 0;font-size:13px;color:#d8def4">'+esc(summary)+'</p><div style="font-size:12px;color:var(--muted)">'+words.slice(0,8).map(w=>esc(w.word)+' ('+w.count+')').join(', ')+(words.length>8?'...':'')+'</div></div>';}).join('');}catch(e){$('#hist-list').innerHTML='<p style="color:#ffb6c6">Ошибка загрузки: '+esc(e.message)+'</p>';}}
async function triggerAiAnalysis(manual=false){if(analyzing)return;if(!state||!state.words||!state.words.length){if(manual)toast('Нет ответов для анализа');return;}const target={...state};const promptText=buildAiPrompt();const cfg=getAiConfig();if(!cfg.key){if(manual){openPromptModal(promptText);toast('Ключ OpenAI не настроен: подготовлен промпт для ручной передачи в LLM');}return;}analyzing=true;if(secret)$('#btn-analyze').textContent='⏳ Анализируем...';try{const jsonRes=await api('rooms/'+code+'/ai-analyze',{endpoint:cfg.endpoint,apiKey:cfg.key,model:cfg.model,prompt:promptText},true);let content=jsonRes.choices?.[0]?.message?.content||'{}';content=content.replace(/^[^{]*({[\s\S]*})[^}]*$/,'$1');const parsed=JSON.parse(content);lastAnalyzedRound=target.round;if(secret){await api('rooms/'+code+'/analysis',{round:target.round,analysis:parsed},true);saveHistoryItem({round:target.round,question:target.question,words:target.words,analysis:parsed});if(state.round===target.round&&state.view!=='waiting'){renderAnalysis(parsed);control('tab',{tab:'summary'})}toast('Анализ ответов готов!');}}catch(e){console.error(e);if(manual)toast('Ошибка анализа: '+e.message);}finally{analyzing=false;if(secret&&$('#btn-analyze'))$('#btn-analyze').textContent='✨ Анализ ответов (AI)';}}

 groups.querySelector('#round-controls').append($('#show-current'),controls.querySelector('.action-row'),$('#next-question'));
 groups.querySelector('#display-controls').append($('#waiting'),$('#screen'));
 groups.querySelector('#analysis-controls').append($('#btn-analyze'),$('#settings'));
 ['show-current','screen','btn-analyze'].forEach(id=>$('#'+id).removeAttribute('style'));
 controls.querySelector('.queue-actions').remove();
 const moderation=document.createElement('div');moderation.className='host-moderation';
 moderation.append($('#word-list').previousElementSibling.previousElementSibling,$('#word-list').previousElementSibling,$('#word-list'));controls.append(moderation);
 const nav=document.createElement('div');nav.className='host-tabs';nav.setAttribute('role','tablist');nav.setAttribute('aria-label','Панель ведущего');
 nav.innerHTML='<button id="host-tab-live" class="host-tab" role="tab" aria-selected="true" aria-controls="host-live" data-host-panel="live">Эфир</button><button id="host-tab-questions" class="host-tab" role="tab" aria-selected="false" aria-controls="host-questions" data-host-panel="questions">Вопросы</button><button id="host-tab-settings" class="host-tab" role="tab" aria-selected="false" aria-controls="host-settings" data-host-panel="settings">Настройки и история</button>';
 layout.before(nav);
 const panel=document.createElement('section');panel.id='host-questions';panel.hidden=true;panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby','host-tab-questions');
 panel.innerHTML='<div class="questions-layout"><section class="card" id="questions-list-panel"><h2>Вопросы комнаты</h2><p class="questions-intro">Подготовьте вопросы и задайте порядок. Изменения здесь не переключают эфир. После первого показа вопрос нельзя редактировать.</p></section><section class="card"><h2 id="question-editor-heading">Добавить вопрос</h2><div id="question-editor-slot"></div></section></div>';
 layout.after(panel);
 const settings=document.createElement('section');settings.id='host-settings';settings.hidden=true;settings.setAttribute('role','tabpanel');settings.setAttribute('aria-labelledby','host-tab-settings');
 settings.innerHTML='<div class="settings-layout"><div class="settings-column" style="display:grid;gap:24px"><section class="card" id="waiting-screen-settings"><h2>Экран ожидания</h2><p style="font-size:13px">Тема встречи и заставка, которые видят участники до начала и между вопросами.</p><form id="waiting-editor" class="form"><label>Тема комнаты<input name="theme" maxlength="180" placeholder="Например, идеи для нашей команды"></label><label>Заголовок<input name="title" maxlength="180" required></label><label>Описание<textarea name="text" maxlength="1000" rows="3"></textarea></label><div class="row" style="justify-content:flex-end;margin-top:12px"><button type="button" id="waiting-cancel" class="secondary">Отменить изменения</button><button type="submit">Сохранить</button></div></form></section><section class="card" id="openai-settings"></section></div><section class="card"><div class="row" style="justify-content:space-between"><h2>История раундов и ответов</h2><button id="refresh-history" class="secondary small">Обновить</button></div><div id="history-slot"></div></section></div>';
 panel.after(settings);
 $('#openai-settings').append(...$('#ai-modal .modal').children);$('#ai-modal').remove();
 const history=$('#hist-list');history.removeAttribute('style');$('#history-slot').append(history);$('#hist-modal').remove();
 $('#refresh-history').onclick=()=>loadHistory();fillAiSettings();fillWaitingSettings();
 $('#waiting-cancel').onclick=()=>fillWaitingSettings();
 $('#waiting-editor').onsubmit=async e=>{e.preventDefault();const f=$('#waiting-editor'),btn=f.querySelector('button[type="submit"]');btn.disabled=true;try{const saved=await control('waiting-settings',{theme:f.elements.theme.value,title:f.elements.title.value,text:f.elements.text.value});if(saved)toast('Настройки экрана ожидания сохранены');}finally{btn.disabled=false;}};
 const queue=$('#question-queue');queue.previousElementSibling.remove();$('#questions-list-panel').append(queue,$('#reset'));
 const resetBox=document.createElement('section');resetBox.className='room-reset';resetBox.innerHTML='<h2>Начать встречу заново</h2><p>Очистить ответы, анализ и модерацию всех раундов. Вопросы, их порядок, настройки, код комнаты и ссылки сохранятся.</p><button id="reset-room" class="danger">Сбросить состояние комнаты</button>';settings.append(resetBox);
 const confirmation=document.createElement('div');confirmation.className='modal-overlay';confirmation.id='reset-room-modal';confirmation.hidden=true;confirmation.setAttribute('role','dialog');confirmation.setAttribute('aria-modal','true');confirmation.setAttribute('aria-labelledby','reset-room-title');
 confirmation.innerHTML='<div class="modal"><h2 id="reset-room-title">Сбросить состояние комнаты?</h2><p>Ответы, история раундов, анализ и скрытые слова будут удалены без возможности восстановления. Приём ответов остановится. Все вопросы снова станут доступны для редактирования и проведения.</p><p>Настройки вопросов, текст ожидания, код и ссылки комнаты сохранятся.</p><div class="row"><button id="cancel-room-reset" class="secondary">Отмена</button><button id="confirm-room-reset" class="danger">Сбросить и очистить ответы</button></div></div>';document.body.append(confirmation);
 $('#reset-room').onclick=()=>{confirmation.dataset.revision=String(state.revision);confirmation.hidden=false;$('#cancel-room-reset').focus();};
 $('#cancel-room-reset').onclick=()=>{confirmation.hidden=true;$('#reset-room').focus();};
 $('#confirm-room-reset').onclick=async()=>{const button=$('#confirm-room-reset');button.disabled=true;try{const saved=await control('reset-room',{confirm:true,revision:Number(confirmation.dataset.revision)});confirmation.hidden=true;if(saved){editQuestion();selectHostPanel('live');toast('Комната готова к новой встрече');}}finally{button.disabled=false;}};
 confirmation.onkeydown=e=>{if(e.key==='Escape')$('#cancel-room-reset').click();};
 nav.querySelectorAll('[data-host-panel]').forEach(button=>button.onclick=()=>selectHostPanel(button.dataset.hostPanel));
}
function selectHostPanel(name){
 if(!secret)return;
 ['live','questions','settings'].forEach(panel=>$('#host-'+panel).hidden=panel!==name);
 document.querySelectorAll('[data-host-panel]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.hostPanel===name)));
 if(name==='live'&&cloud)cloud.resize();
 if(name==='settings'){loadHistory();fillAiSettings();fillWaitingSettings();}
 if(name==='questions'&&!$('#series-editor').onsubmit)editQuestion();
}
function installSeriesEditor(){
 $('#question-editor-slot').innerHTML='<form id="series-editor" class="question-editor"><label>Вопрос<input name="question" maxlength="180" required></label><div class="two"><label>Ответов на человека<input name="maxAnswers" type="number" min="1" max="10" required></label><label>Время, секунд (0 — без таймера)<input name="duration" type="number" min="0" max="3600" required></label></div><div class="row"><button>Сохранить</button><button type="button" id="series-cancel" class="secondary">Новый вопрос</button></div></form>';
 $('#series-cancel').onclick=()=>editQuestion();
}
function editQuestion(q){
 const f=$('#series-editor');f.hidden=false;$('#question-editor-heading').textContent=q?'Редактировать вопрос':'Добавить вопрос';
 f.elements.question.value=q?.question||'';f.elements.maxAnswers.value=q?.maxAnswers??queueState?.defaults?.maxAnswers??state.maxAnswers;f.elements.duration.value=q?.duration??queueState?.defaults?.duration??state.duration;
 f.onsubmit=async e=>{e.preventDefault();const saved=await control(q?'edit':'add',{...(q?{id:q.id}:{}),question:f.elements.question.value,maxAnswers:+f.elements.maxAnswers.value,duration:+f.elements.duration.value});if(saved){editQuestion();toast(q?'Вопрос сохранён':'Вопрос добавлен');}};selectHostPanel('questions');f.elements.question.focus();
}
function editWaiting(){selectHostPanel('settings');const f=$('#waiting-editor');if(f&&f.elements.theme)f.elements.theme.focus();}
function fillWaitingSettings(){if(!state)return;const f=$('#waiting-editor');if(!f)return;f.elements.theme.value=state.theme||'';f.elements.title.value=state.waitingTitle||'';f.elements.text.value=state.waitingText||'';}
async function loadQueue(force=false){
 if(!secret||queueLoading||(!force&&queueState?.revision===state?.revision))return;queueLoading=true;
 try{const data=await api('rooms/'+code+'/questions',undefined,true);queueState=data;renderQueue();}catch(e){toast(e.message)}finally{queueLoading=false;}
}
function renderQueue(){
 const list=$('#question-queue');if(!list||!queueState)return;
 const signature=JSON.stringify([queueState.questions,state.round,state.status,state.view]);if(list.dataset.signature===signature)return;list.dataset.signature=signature;
 const busy=['open','paused'].includes(state.status);
 list.innerHTML=queueState.questions.map((q,i)=>'<div class="queue-item '+(q.round===state.round?'current':'')+'"><div class="queue-heading"><span class="queue-number">'+String(i+1).padStart(2,'0')+'</span><span class="queue-label">ВОПРОС</span><span class="queue-status" data-status="'+(q.shown?q.status:'prepared')+'">'+(q.shown?(q.status==='ready'?'Вопрос показан':statuses[q.status]||'Вопрос показан'):'Подготовлен')+'</span>'+(q.round===state.round?'<span class="queue-current">Текущий</span>':'')+'</div><strong>'+esc(q.question)+'</strong><p class="queue-meta"><span>'+(q.duration?'Таймер: '+q.duration+' сек.':'Без таймера')+'</span><span>Ответов на человека: '+q.maxAnswers+'</span></p><div class="row"><button data-op="show" data-id="'+q.id+'" '+(busy&&q.round!==state.round?'disabled':'')+'>'+(q.status==='stopped'?'Показать результаты':'Показать вопрос')+'</button>'+(!q.shown?'<button class="secondary" data-op="edit" data-id="'+q.id+'">Изменить</button><button class="secondary" data-op="move" data-direction="-1" data-id="'+q.id+'" '+(!i||queueState.questions[i-1].shown?'disabled':'')+' aria-label="Выше">↑</button><button class="secondary" data-op="move" data-direction="1" data-id="'+q.id+'" '+(i===queueState.questions.length-1||queueState.questions[i+1]?.shown?'disabled':'')+' aria-label="Ниже">↓</button><button class="danger" data-op="delete" data-id="'+q.id+'" '+(q.round===state.round?'disabled':'')+'>Удалить</button>':'')+'</div></div>').join('');
 list.querySelectorAll('button').forEach(b=>b.onclick=()=>{const q=queueState.questions.find(q=>q.id===b.dataset.id);if(b.dataset.op==='edit')editQuestion(q);else control(b.dataset.op,{id:q.id,direction:Number(b.dataset.direction)}).then(saved=>{if(saved&&b.dataset.op==='show')selectHostPanel('live')})});
 $('#next-question').disabled=busy||!queueState.questions.some(q=>!q.shown);$('#show-current').disabled=!queueState.questions.some(q=>q.round===state.round);$('#waiting').disabled=state.view==='waiting';
}
async function control(action,data={}){try{render(await api('rooms/'+code+'/control',{action,revision:state?.revision,...data},true));await loadQueue(true);return true;}catch(e){toast(e.message);await refresh();await loadQueue(true);return false;}}let streaming=false,lastPoll=0;let refreshing=false;async function refresh(){if(refreshing||(streaming&&Date.now()-lastPoll<1200))return;lastPoll=Date.now();refreshing=true;try{render(await api('rooms/'+code+'?participant='+participant));$('#connection').textContent='';}catch(e){$('#connection').textContent=e.message;$('#connection').classList.add('connection');if($('#send'))$('#send').disabled=true;}finally{refreshing=false}}
function render(s){if(state&&(s.revision<state.revision||(s.revision===state.revision&&s.now<state.now)))return;const changed=state?.round!==s.round,resetChanged=!!state&&state.resetToken!==s.resetToken,stoppedNow=state?.status!=='stopped'&&s.status==='stopped';state=s;syncHistoryToken(s.resetToken);state.receivedAt=performance.now();$('#question').textContent=s.view==='waiting'?s.waitingTitle:s.question;$('#status').textContent=s.view==='waiting'?'Ожидание':s.status==='ready'?'Вопрос показан — ждём старта':statuses[s.status];tick();
if(resetChanged){promptContext=null;lastAnalyzedRound=0;if($('#hist-list')){$('#hist-list').innerHTML='<p>История пока пуста.</p>';if(!$('#host-settings').hidden)loadHistory();}if($('#prompt-modal'))$('#prompt-modal').hidden=true;}
if(changed){if(cloud)cloud.update([]);if($('#answer-input'))$('#answer-input').value='';if($('#sent'))$('#sent').hidden=true;document.querySelectorAll('.tab-view:not(#tab-cloud)').forEach(v=>v.innerHTML='<p>Анализ пока не проводился.</p>');}
if(secret){const we=$('#waiting-editor');if(we&&(!document.activeElement||!we.contains(document.activeElement)))fillWaitingSettings();if(queueState){const q=queueState.questions.find(q=>q.round===s.round);if(q)Object.assign(q,{status:s.status,remaining:s.remaining});renderQueue();}loadQueue();}
const waiting=s.view==='waiting';
if($('#broadcast-wait')){$('#broadcast-wait').hidden=!waiting;$('#waiting-theme').textContent=s.theme||'Встреча в МыслиВслуХ';$('#waiting-title').textContent=s.waitingTitle;$('#waiting-text').textContent=s.waitingText;document.querySelectorAll('.cloud-stage,.tabs-bar,.stats').forEach(el=>el.hidden=waiting);$('#question').hidden=waiting;const pj=$('.present-join');if(pj)pj.hidden=waiting;}
if($('#answer-form')){$('.phone').classList.toggle('is-waiting',waiting);$('#phone-lobby').hidden=!waiting;$('#phone-theme').textContent=s.theme||'Встреча в МыслиВслуХ';$('#status').hidden=waiting;$('#answer-form').hidden=waiting;$('#remaining').hidden=waiting;$('.phone .notice').hidden=waiting;$('#phone-waiting-text').hidden=!waiting;$('#phone-waiting-text').textContent=s.waitingText;if(waiting)$('#sent').hidden=true;}
$('#timer').hidden=waiting;

if(cloud){cloud.setActive(s.status==='open');cloud.update(s.words);$('#empty').classList.toggle('hidden',s.words.length>0);$('#people').textContent=s.people;$('#answers').textContent=s.answers;$('#words').textContent=s.words.length;
if(s.analysis)renderAnalysis(s.analysis);if(currentTab!==s.tab)switchTab(s.tab);
if(stoppedNow&&!s.analysis&&secret&&s.words.length&&lastAnalyzedRound!==s.round){triggerAiAnalysis(false);}
if(secret){$('#start').disabled=s.view==='waiting'||!['ready','paused'].includes(s.status);$('#start').textContent=s.status==='paused'?'Продолжить →':'Начать приём ответов →';$('#pause').disabled=s.status!=='open';$('#stop').disabled=['stopped','ready'].includes(s.status);$('#settings').textContent=s.maxAnswers+' отв. на человека · '+(s.filter?'Фильтр включён':'Фильтр выключен');const signature=JSON.stringify(s.words);if($('#word-list').dataset.signature!==signature){$('#word-list').dataset.signature=signature;$('#word-list').innerHTML=s.words.map(w=>'<div class="word-row"><span>'+esc(w.word)+' <b style="color:var(--lime)">'+w.count+'</b></span><button class="secondary small" data-word="'+esc(w.word)+'" aria-label="Скрыть '+esc(w.word)+'">Скрыть</button></div>').join('');$('#word-list').querySelectorAll('button').forEach(b=>b.onclick=()=>control('hide',{word:b.dataset.word}));}}}else{$('#remaining').textContent='Осталось ответов: '+Math.max(0,s.maxAnswers-s.used)+' из '+s.maxAnswers;if(changed)$('#sent').hidden=true;updateSend();}}
function tick(){if(!state)return;const ms=state.status==='open'&&state.deadline?state.deadline-(state.now+performance.now()-state.receivedAt):state.remaining;$('#timer').textContent=state.duration?Math.max(0,Math.ceil(ms/1000))+' сек.':'Без таймера';if(state.status==='open'&&state.deadline&&ms<=0&&!state.autoStopping){state.autoStopping=true;refresh();}}
function updateSend(){if($('#send')&&state){$('#send').disabled=state.status!=='open'||state.used>=state.maxAnswers;$('#send').textContent=state.status==='open'?(state.used>=state.maxAnswers?'Все ответы отправлены':'Отправить ответ ↗'):state.status==='ready'?'Ждём начала приёма':statuses[state.status]}}
// __CLOUD_CODE__
if(code&&/^\d{6}$/.test(code))roomUI();else home();
</script></body></html>
