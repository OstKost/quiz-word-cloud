server {
    listen 80;
    server_name quiz.ost.wang;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://quiz.ost.wang$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name quiz.ost.wang;
    ssl_certificate /etc/letsencrypt/live/quiz.ost.wang/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.ost.wang/privkey.pem;
    client_max_body_size 8k;
    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
